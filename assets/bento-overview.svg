  <g transform="translate(68, 60)">
    <rect width="346" height="176" rx="10" fill="url(#cellBg)" stroke="#1E2432" stroke-width="1" />
    <text x="22" y="30" fill="#68707E" font-size="10" font-weight="700" class="mono">02.1 / SYSTEM BOUNDARIES</text>
    <text x="22" y="60" fill="#F5F2EB" font-size="18" font-weight="700" class="sans">
      Clarity over <tspan class="serif-italic" font-weight="400" fill="#E5484D">cleverness.</tspan>
    </text>
    <text x="22" y="86" fill="#9BA3B0" font-size="12.5" class="sans">
      Strict separation between server truth and
    </text>
    <text x="22" y="104" fill="#9BA3B0" font-size="12.5" class="sans">
      UI state, paired with defense-in-depth APIs.
    </text>

    <g transform="translate(22, 128)">
      <rect width="86" height="26" rx="5" fill="#161C28" stroke="#262E3E" />
      <text x="43" y="16.5" text-anchor="middle" fill="#D5D9E2" font-size="9.5" font-weight="600" class="mono">NEXT.JS 16</text>
      <text x="97" y="16.5" fill="#E5484D" font-size="11" class="mono">→</text>
      <rect x="111" width="86" height="26" rx="5" fill="#161C28" stroke="#262E3E" />
      <text x="154" y="16.5" text-anchor="middle" fill="#D5D9E2" font-size="9.5" font-weight="600" class="mono">API / RBAC</text>
      <text x="208" y="16.5" fill="#E5484D" font-size="11" class="mono">→</text>
      <rect x="222" width="80" height="26" rx="5" fill="#161C28" stroke="#262E3E" />
      <text x="262" y="16.5" text-anchor="middle" fill="#D5D9E2" font-size="9.5" font-weight="600" class="mono">PG / RLS</text>
    </g>
