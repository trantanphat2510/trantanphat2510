    <g transform="translate(22, 114)">
      <rect width="296" height="44" rx="8" fill="#151A25" stroke="#222938" />
      <text x="14" y="26" fill="#D5D9E2" font-size="12" font-weight="600" class="sans">Single-flight cache · Idempotent SQL · Docker</text>
    </g>
