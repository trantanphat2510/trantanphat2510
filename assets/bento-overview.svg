    <text x="44" y="60" fill="#F5F2EB" font-size="13.5" font-weight="700" class="sans">VNDTS Company</text>
    <text x="180" y="60" fill="#8C94A4" font-size="12" class="sans">· Full-Stack Dev</text>
    <text x="344" y="59" text-anchor="end" fill="#E5484D" font-size="9.5" font-weight="600" class="mono">2025–NOW</text>

    <circle cx="28" cy="102" r="3.5" fill="#0D1017" stroke="#68707E" stroke-width="1.5" />
    <text x="44" y="106" fill="#E2E6EE" font-size="13.5" font-weight="600" class="sans">HITEK Solution</text>
    <text x="168" y="106" fill="#8C94A4" font-size="12" class="sans">· Full-Stack Dev</text>
    <text x="344" y="105" text-anchor="end" fill="#7D8594" font-size="9.5" font-weight="600" class="mono">2025</text>

    <circle cx="28" cy="148" r="3.5" fill="#0D1017" stroke="#68707E" stroke-width="1.5" />
    <text x="44" y="152" fill="#E2E6EE" font-size="13.5" font-weight="600" class="sans">HUTECH University</text>
    <text x="188" y="152" fill="#8C94A4" font-size="12" class="sans">· B.Sc. in IT</text>
    <text x="344" y="151" text-anchor="end" fill="#7D8594" font-size="9.5" font-weight="600" class="mono">2021–2025</text>
  </g>

  <!-- BENTO CELL 3: BENCHMARKS -->
  <g transform="translate(812, 60)">
    <rect width="340" height="176" rx="10" fill="url(#cellBg)" stroke="#1E2432" stroke-width="1" />
    <text x="22" y="30" fill="#68707E" font-size="10" font-weight="700" class="mono">02.3 / QUALITY GATES</text>

    <g transform="translate(22, 46)">
      <rect width="142" height="58" rx="8" fill="#151A25" stroke="#222938" />
      <text x="14" y="28" fill="#F5F2EB" font-size="20" font-weight="800" class="sans">99–100</text>
      <text x="14" y="46" fill="#8C94A4" font-size="9.5" font-weight="600" class="mono">LIGHTHOUSE</text>

      <rect x="154" width="142" height="58" rx="8" fill="#151A25" stroke="#222938" />
      <text x="168" y="28" fill="#E5484D" font-size="20" font-weight="800" class="sans">3-Layer</text>
      <text x="168" y="46" fill="#8C94A4" font-size="9.5" font-weight="600" class="mono">JWT · RBAC · RLS</text>
