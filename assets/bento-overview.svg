<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E13" />
      <stop offset="100%" stop-color="#0F131B" />
    </linearGradient>
    <linearGradient id="cellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121722" />
      <stop offset="100%" stop-color="#0D1017" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .serif-italic {
        font-family: 'Fraunces', 'Playfair Display', Georgia, serif;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Unified Outer Frame -->
  <rect width="1200" height="260" rx="14" fill="url(#bg)" />
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="13.25" fill="none" stroke="#1E232E" stroke-width="1.5" />

  <!-- Continuous Left Architectural Spine -->
  <line x1="48" y1="0" x2="48" y2="260" stroke="#1E232E" stroke-width="1" />
  <line x1="48" y1="0" x2="48" y2="46" stroke="#E5484D" stroke-width="1.5" />
  <circle cx="48" cy="36" r="3.5" fill="#E5484D" />

  <!-- Section Header -->
  <text x="68" y="40" fill="#E5484D" font-size="11" font-weight="700" class="mono">02 / ENGINEERING OVERVIEW</text>
  <text x="304" y="40" fill="#3B4252" font-size="11" class="mono">·</text>
  <text x="322" y="40" fill="#8C94A4" font-size="11" font-weight="500" class="mono">ARCHITECTURE, EXPERIENCE &amp; STANDARDS</text>

