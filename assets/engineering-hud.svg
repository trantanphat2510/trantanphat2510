  <!-- ===================================================================== -->
  <rect x="428" y="10" width="406" height="124" rx="10" fill="url(#cardBg)" stroke="#2A3957" stroke-width="1.2" />
  <rect x="442" y="10" width="110" height="2.2" rx="1.1" fill="#38BDF8" />
  <circle cx="444" cy="25" r="2.5" fill="#38BDF8" class="pulse" />
