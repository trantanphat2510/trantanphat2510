<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 136" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121A2D" />
      <stop offset="100%" stop-color="#0A0F1A" />
    </linearGradient>
    <linearGradient id="radarPolyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pipeTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
      .radar-spin { animation: radarSpinAnim 6s infinite linear; transform-origin: 124px 76px; will-change: transform; }
      .packet-flow-1 { animation: packetFlowAnim 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1); will-change: transform, opacity; }
      .packet-flow-2 { animation: packetFlowAnim 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1) 1.6s; will-change: transform, opacity; }
      .beacon-ring { animation: beaconRingAnim 2.4s infinite ease-out; transform-origin: 878px 58px; will-change: transform, opacity; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes radarSpinAnim {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes packetFlowAnim {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(312px); opacity: 0; }
      }
      @keyframes beaconRingAnim {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

