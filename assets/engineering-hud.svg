<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 144" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#0B101C" />
    </linearGradient>
    <linearGradient id="radarPolyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="radarSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pipeTrackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
      .radar-spin { animation: radarSpinAnim 6s infinite linear; transform-origin: 126px 80px; }
      .packet-flow-1 { animation: packetFlowAnim 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
      .packet-flow-2 { animation: packetFlowAnim 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1) 1.6s; }
      .beacon-ring { animation: beaconRingAnim 2.4s infinite ease-out; transform-origin: 878px 62px; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes radarSpinAnim {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes packetFlowAnim {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(312px); opacity: 0; }
      }
      @keyframes beaconRingAnim {
        0% { transform: scale(0.6); opacity: 0.9; }
        100% { transform: scale(2.2); opacity: 0; }
      }
    </style>
  </defs>

  <!-- 1200px Obsidian Monolith Frame -->
  <rect width="1200" height="144" rx="14" fill="url(#canvasBg)" />
  <rect x="0.75" y="0.75" width="1198.5" height="142.5" rx="13.25" fill="none" stroke="#263046" stroke-width="1.5" />

  <!-- Continuous Architectural Spine Node 06 at x=36 -->
  <line x1="32" y1="0" x2="32" y2="144" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" />
  <line x1="36" y1="0" x2="36" y2="144" stroke="#2E3C59" stroke-width="1.6" />
  <circle cx="36" cy="72" r="6.5" fill="#0B0F17" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="1.2" />
  <circle cx="36" cy="72" r="2.8" fill="#38BDF8" class="pulse" />
  <line x1="42.5" y1="72" x2="61" y2="72" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="61" cy="72" r="2" fill="#7DD3FC" />

  <!-- ===================================================================== -->
  <!-- CHAMBER 06.A // SKILL RADAR & CORE COMPETENCY HUD (x=64..414, w=350)  -->
  <!-- ===================================================================== -->
  <rect x="64" y="10" width="350" height="124" rx="10" fill="url(#cardBg)" stroke="#2A3957" stroke-width="1.2" />
  <rect x="78" y="10" width="90" height="2.2" rx="1.1" fill="#E5484D" />
  <circle cx="80" cy="25" r="2.5" fill="#E5484D" class="pulse" />
  <text x="88" y="28" fill="#FF6B72" font-size="8.8" font-weight="800" class="mono">06.A // SKILL RADAR HUD</text>
  <rect x="342" y="16" width="60" height="15" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="0.8" />
  <text x="372" y="26" text-anchor="middle" fill="#38BDF8" font-size="7.2" font-weight="800" class="mono">96% AVG</text>

  <!-- Left: Pentagonal Cyber Skill Radar Chart (Center: 126, 80, R=38) -->
  <circle cx="126" cy="80" r="38" fill="#070B13" stroke="#1E293B" stroke-width="1" />
  <!-- Concentric Pentagon Rings -->
  <polygon points="126,44 160,69 147,109 105,109 92,69" fill="none" stroke="#1E293B" stroke-width="0.85" />
  <polygon points="126,56 149,73 140,99 112,99 103,73" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="2 2" />
  <polygon points="126,68 137,76 133,90 119,90 115,76" fill="none" stroke="#1E293B" stroke-width="0.75" />
  <!-- 5 Radar Axis Spokes -->
  <line x1="126" y1="80" x2="126" y2="42" stroke="#1E293B" stroke-width="0.8" />
  <line x1="126" y1="80" x2="162" y2="68" stroke="#1E293B" stroke-width="0.8" />
  <line x1="126" y1="80" x2="148" y2="111" stroke="#1E293B" stroke-width="0.8" />
  <line x1="126" y1="80" x2="104" y2="111" stroke="#1E293B" stroke-width="0.8" />
  <line x1="126" y1="80" x2="90" y2="68" stroke="#1E293B" stroke-width="0.8" />
  <!-- Rotating Radar Scanner Sector -->
  <g class="radar-spin">
    <path d="M 126 80 L 126 42 A 38 38 0 0 1 158 60 Z" fill="url(#radarSweepGrad)" />
    <line x1="126" y1="80" x2="126" y2="42" stroke="#38BDF8" stroke-width="1.2" />
  </g>
  <!-- High-Performance Skill Polygon (98%, 95%, 94%, 92%, 99%) -->
  <polygon points="126,45 158,69.5 146,107.5 106.5,106.5 91,68.5" fill="url(#radarPolyGrad)" stroke="#38BDF8" stroke-width="1.35" stroke-linejoin="round" />
  <!-- 5 Glowing Vertex Nodes -->
  <circle cx="126" cy="45" r="2.3" fill="#E5484D" stroke="#FFFFFF" stroke-width="0.6" />
  <circle cx="158" cy="69.5" r="2.3" fill="#F59E0B" stroke="#FFFFFF" stroke-width="0.6" />
  <circle cx="146" cy="107.5" r="2.3" fill="#38BDF8" stroke="#FFFFFF" stroke-width="0.6" />
  <circle cx="106.5" cy="106.5" r="2.3" fill="#A855F7" stroke="#FFFFFF" stroke-width="0.6" />
  <circle cx="91" cy="68.5" r="2.3" fill="#10B981" stroke="#FFFFFF" stroke-width="0.6" />

  <!-- Right: 5 Core Competency Telemetry Bars (x=180..400) -->
  <!-- Row 1: Frontend & Next.js -->
  <text x="180" y="47" fill="#E2E8F0" font-size="7.4" font-weight="700" class="mono">FRONTEND / NEXT.JS</text>
  <text x="400" y="47" text-anchor="end" fill="#FF6B72" font-size="7.4" font-weight="800" class="mono">98%</text>
  <rect x="180" y="50" width="220" height="4" rx="2" fill="#090D16" />
  <rect x="180" y="50" width="215" height="4" rx="2" fill="#E5484D" />

  <!-- Row 2: Backend & PG-16 RLS -->
  <text x="180" y="64" fill="#E2E8F0" font-size="7.4" font-weight="700" class="mono">NESTJS / PG-16 RLS</text>
  <text x="400" y="64" text-anchor="end" fill="#FBBF24" font-size="7.4" font-weight="800" class="mono">95%</text>
  <rect x="180" y="67" width="220" height="4" rx="2" fill="#090D16" />
  <rect x="180" y="67" width="209" height="4" rx="2" fill="#F59E0B" />

  <!-- Row 3: WebRTC & Voice AI -->
  <text x="180" y="81" fill="#E2E8F0" font-size="7.4" font-weight="700" class="mono">WEBRTC / FASTAPI AI</text>
  <text x="400" y="81" text-anchor="end" fill="#38BDF8" font-size="7.4" font-weight="800" class="mono">94%</text>
  <rect x="180" y="84" width="220" height="4" rx="2" fill="#090D16" />
  <rect x="180" y="84" width="206" height="4" rx="2" fill="#38BDF8" />

  <!-- Row 4: 60fps UI Motion & Design Eng -->
