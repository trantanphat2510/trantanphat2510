  <rect x="728" y="16" width="92" height="15" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
  <text x="774" y="26" text-anchor="middle" fill="#34D399" font-size="7.0" font-weight="800" class="mono">✔ 4/4 PASSED</text>

  <!-- Conveyor Fiber-Optic Track Behind Nodes (x=475..787, y=68) -->
  <line x1="475" y1="68" x2="787" y2="68" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
  <line x1="475" y1="68" x2="787" y2="68" stroke="url(#pipeTrackGrad)" stroke-width="1.6" stroke-dasharray="4 3" />
  <!-- Animated Streaming Data Packets on Conveyor Track -->
  <g class="packet-flow-1">
    <rect x="468" y="65.5" width="14" height="5" rx="2.5" fill="#38BDF8" />
    <circle cx="475" cy="68" r="1.8" fill="#FFFFFF" />
  </g>
  <g class="packet-flow-2">
    <rect x="468" y="65.5" width="14" height="5" rx="2.5" fill="#10B981" />
    <circle cx="475" cy="68" r="1.8" fill="#FFFFFF" />
  </g>

  <!-- Stage Node 1: TS 5.8 & Lint (x=442..526) -->
  <rect x="442" y="42" width="84" height="52" rx="7" fill="#0B111E" stroke="#38BDF8" stroke-width="1.1" />
  <rect x="448" y="47" width="36" height="11" rx="3" fill="#0C4A6E" />
  <text x="466" y="54.8" text-anchor="middle" fill="#7DD3FC" font-size="6.2" font-weight="800" class="mono">STAGE 1</text>
  <circle cx="516" cy="52.5" r="2.5" fill="#10B981" />
  <text x="484" y="71" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="800" class="sans">TS 5.8 Check</text>
  <text x="484" y="84" text-anchor="middle" fill="#94A3B8" font-size="6.8" font-weight="700" class="mono">0 ERRORS · STRICT</text>

  <!-- Stage Node 2: Playwright E2E (x=540..624) -->
  <rect x="540" y="42" width="84" height="52" rx="7" fill="#0B111E" stroke="#A855F7" stroke-width="1.1" />
  <rect x="546" y="47" width="36" height="11" rx="3" fill="#3B0764" />
  <text x="564" y="54.8" text-anchor="middle" fill="#D8B4FE" font-size="6.2" font-weight="800" class="mono">STAGE 2</text>
  <circle cx="614" cy="52.5" r="2.5" fill="#10B981" />
  <text x="582" y="71" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="800" class="sans">Playwright</text>
  <text x="582" y="84" text-anchor="middle" fill="#94A3B8" font-size="6.8" font-weight="700" class="mono">E2E SPECS · PASS</text>

  <!-- Stage Node 3: Docker & PG RLS (x=638..722) -->
  <rect x="638" y="42" width="84" height="52" rx="7" fill="#0B111E" stroke="#F59E0B" stroke-width="1.1" />
  <rect x="644" y="47" width="36" height="11" rx="3" fill="#451A03" />
  <text x="662" y="54.8" text-anchor="middle" fill="#FCD34D" font-size="6.2" font-weight="800" class="mono">STAGE 3</text>
  <circle cx="712" cy="52.5" r="2.5" fill="#10B981" />
  <text x="680" y="71" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="800" class="sans">Docker &amp; DB</text>
  <text x="680" y="84" text-anchor="middle" fill="#94A3B8" font-size="6.8" font-weight="700" class="mono">PG-16 RLS · PRISMA</text>

  <!-- Stage Node 4: Vercel Edge Prod (x=736..820) -->
  <rect x="736" y="42" width="84" height="52" rx="7" fill="#091917" stroke="#10B981" stroke-width="1.2" />
  <rect x="742" y="47" width="36" height="11" rx="3" fill="#064E3B" />
  <text x="760" y="54.8" text-anchor="middle" fill="#6EE7B7" font-size="6.2" font-weight="800" class="mono">STAGE 4</text>
  <circle cx="810" cy="52.5" r="2.5" fill="#10B981" class="pulse" />
  <text x="778" y="71" text-anchor="middle" fill="#34D399" font-size="9.5" font-weight="800" class="sans">Edge Live</text>
  <text x="778" y="84" text-anchor="middle" fill="#6EE7B7" font-size="6.8" font-weight="800" class="mono">100/100 VITALS</text>

  <!-- Pipeline Footer Telemetry Strip (y=102..124) -->
  <rect x="442" y="102" width="378" height="22" rx="5" fill="#080C15" stroke="#1E293B" stroke-width="0.9" />
  <text x="452" y="115.5" fill="#94A3B8" font-size="7.2" font-weight="700" class="mono">⚡ AVG DEPLOY: <tspan fill="#FFFFFF">34s</tspan> · ZERO-DOWNTIME EDGE · <tspan fill="#34D399">4 PRODUCTION CLUSTERS</tspan></text>

  <!-- ===================================================================== -->
  <!-- CHAMBER 06.C // SAIGON (UTC+7) TELEMETRY & AVAILABILITY (x=848..1160) -->
  <!-- ===================================================================== -->
  <rect x="848" y="10" width="312" height="124" rx="10" fill="url(#cardBg)" stroke="#2A3957" stroke-width="1.2" />
  <rect x="862" y="10" width="96" height="2.2" rx="1.1" fill="#10B981" />
  <circle cx="864" cy="25" r="2.5" fill="#10B981" class="pulse" />
  <text x="872" y="28" fill="#34D399" font-size="8.8" font-weight="800" class="mono">06.C // BASE STATION &amp; SLA</text>
  <rect x="1084" y="16" width="62" height="15" rx="4" fill="#0F172A" stroke="#10B981" stroke-opacity="0.6" stroke-width="0.8" />
  <text x="1115" y="26" text-anchor="middle" fill="#34D399" font-size="7.0" font-weight="800" class="mono">UTC+07</text>

  <!-- Location Coordinate Pod (x=862..1146, y=40..82) -->
  <rect x="862" y="40" width="284" height="42" rx="7" fill="#090D16" stroke="#1E293B" stroke-width="0.95" />
  <circle cx="878" cy="61" r="6" fill="none" stroke="#10B981" stroke-width="1.2" class="beacon-ring" />
  <circle cx="878" cy="61" r="3.5" fill="#10B981" class="pulse" />
  <text x="892" y="57.5" fill="#FFFFFF" font-size="11.5" font-weight="800" class="sans">Ho Chi Minh City, Vietnam</text>
  <text x="892" y="71.5" fill="#38BDF8" font-size="7.2" font-weight="700" class="mono">10.7769° N, 106.7009° E · B.S. IT @ HUTECH</text>

  <!-- Dual SLA & Work Status Pills (y=88..124) -->
  <rect x="862" y="88" width="136" height="36" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="0.95" />
  <text x="872" y="102" fill="#94A3B8" font-size="6.8" font-weight="700" class="mono">RESPONSE SLA</text>
