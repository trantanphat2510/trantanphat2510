<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E13" />
      <stop offset="55%" stop-color="#0F131A" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>

    <radialGradient id="crimsonGlow" cx="82%" cy="28%" r="48%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#E5484D" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="subtleWarm" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#F5F2EB" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#E5484D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#222733" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .serif-italic {
        font-family: 'Fraunces', 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
      .pulse-dot {
        animation: pulse 2.4s infinite ease-in-out;
        transform-origin: center;
      }
      .pulse-ring {
        animation: ring 2.4s infinite ease-out;
        transform-origin: center;
      }
      .scanline {
        animation: scan 6s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes ring {
        0% { r: 4px; opacity: 0.7; }
        100% { r: 12px; opacity: 0; }
      }
      @keyframes scan {
        0%, 100% { transform: translateX(0px); opacity: 0.5; }
        50% { transform: translateX(180px); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bg)" />
  <rect width="1200" height="380" rx="18" fill="url(#grid)" />
  <rect width="1200" height="380" rx="18" fill="url(#crimsonGlow)" />
  <rect width="1200" height="380" rx="18" fill="url(#subtleWarm)" />
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="17.25" fill="none" stroke="#232834" stroke-width="1.5" />

  <!-- Architectural Crosshairs -->
  <g stroke="#343B4A" stroke-width="1">
    <line x1="48" y1="68" x2="60" y2="68" />
    <line x1="54" y1="62" x2="54" y2="74" />
    <line x1="1140" y1="68" x2="1152" y2="68" />
    <line x1="1146" y1="62" x2="1146" y2="74" />
  </g>

  <!-- Top Editorial Bar -->
  <text x="54" y="44" fill="#8A919E" font-size="11" font-weight="600" class="mono">00 / PORTFOLIO IDENTITY</text>
  <text x="275" y="44" fill="#464D5C" font-size="11" class="mono">—</text>
  <text x="298" y="44" fill="#C7CCD6" font-size="11" font-weight="500" class="mono">HO CHI MINH CITY, VIETNAM</text>

  <!-- Availability Pill (Top Right) -->
  <g transform="translate(918, 24)">
    <rect width="228" height="30" rx="15" fill="#131822" stroke="#262D3D" stroke-width="1" />
    <circle cx="18" cy="15" r="4" fill="#10B981" class="pulse-ring" />
    <circle cx="18" cy="15" r="4" fill="#10B981" class="pulse-dot" />
    <text x="32" y="19" fill="#E6E9EF" font-size="10.5" font-weight="600" class="mono">AVAILABLE FOR WORK</text>
  </g>

  <!-- Top Divider -->
  <line x1="54" y1="68" x2="1146" y2="68" stroke="#1E232E" stroke-width="1" />

  <!-- Currently Building Tag -->
  <g transform="translate(54, 96)">
    <rect width="256" height="26" rx="6" fill="#1A1217" stroke="#4D2228" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#E5484D" />
    <text x="26" y="17" fill="#F2B8B5" font-size="10.5" font-weight="600" class="mono">CURRENTLY: BUILDING KAIKAI</text>
  </g>

  <!-- Main Display Name -->
  <text x="52" y="196" fill="#F5F2EB" font-size="72" font-weight="800" letter-spacing="-0.03em" class="sans">TRAN TAN PHAT</text>

  <!-- Editorial Tagline with Crimson Italic Serif Accent -->
  <text x="54" y="242" fill="#A9B0BC" font-size="24" font-weight="400" class="sans">
    I turn ideas into <tspan fill="#F5F2EB" font-size="27" class="serif-italic">real web products</tspan><tspan fill="#E5484D" font-size="28" font-weight="700">.</tspan>
  </text>

  <!-- Architectural Accent Line -->
  <line x1="54" y1="278" x2="1146" y2="278" stroke="url(#accentLine)" stroke-width="1.5" />
  <rect x="54" y="276.5" width="84" height="3" rx="1.5" fill="#E5484D" class="scanline" />

  <!-- Bottom Metadata Grid (4 Columns) -->
  <g transform="translate(54, 306)">
    <!-- Col 1 -->
    <text x="0" y="14" fill="#68707E" font-size="10" font-weight="600" class="mono">ROLE</text>
    <text x="0" y="36" fill="#E6E9EF" font-size="14" font-weight="600" class="sans">Full-Stack Developer</text>

    <!-- Col 2 -->
    <line x1="255" y1="0" x2="255" y2="44" stroke="#1E232E" stroke-width="1" />
    <text x="280" y="14" fill="#68707E" font-size="10" font-weight="600" class="mono">CORE ECOSYSTEM</text>
    <text x="280" y="36" fill="#E6E9EF" font-size="14" font-weight="600" class="sans">React 19 · Next.js 16 · NestJS · Python</text>

    <!-- Col 3 -->
    <line x1="615" y1="0" x2="615" y2="44" stroke="#1E232E" stroke-width="1" />
    <text x="640" y="14" fill="#68707E" font-size="10" font-weight="600" class="mono">ENGINEERING FOCUS</text>
    <text x="640" y="36" fill="#E6E9EF" font-size="14" font-weight="600" class="sans">Clean Boundaries · Typed APIs · RLS</text>

    <!-- Col 4 -->
    <line x1="935" y1="0" x2="935" y2="44" stroke="#1E232E" stroke-width="1" />
    <text x="960" y="14" fill="#68707E" font-size="10" font-weight="600" class="mono">PORTFOLIO</text>
    <text x="960" y="36" fill="#E5484D" font-size="14" font-weight="700" class="sans">ttanphat.vercel.app ↗</text>
  </g>
</svg>
