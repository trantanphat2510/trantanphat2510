<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E13" />
      <stop offset="60%" stop-color="#10141D" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>

    <radialGradient id="crimsonGlow" cx="85%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#E5484D" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E232E" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E5484D" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.022" />
    </pattern>

    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .serif-italic {
        font-family: 'Fraunces', 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
      .pulse-dot {
        animation: pulse 2.4s infinite ease-in-out;
      }
      .pulse-ring {
        animation: ring 2.4s infinite ease-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @keyframes ring {
        0% { r: 3.5px; opacity: 0.7; }
        100% { r: 11px; opacity: 0; }
      }
    </style>
  </defs>

  <!-- Main Frame -->
  <rect width="1200" height="340" rx="14" fill="url(#bg)" />
  <rect width="1200" height="340" rx="14" fill="url(#grid)" />
  <rect width="1200" height="340" rx="14" fill="url(#crimsonGlow)" />
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="13.25" fill="none" stroke="#1E232E" stroke-width="1.5" />

  <!-- Continuous Left Architectural Spine (Connects down to next section) -->
  <line x1="48" y1="0" x2="48" y2="340" stroke="#1E232E" stroke-width="1" />
  <line x1="48" y1="240" x2="48" y2="340" stroke="url(#spineGrad)" stroke-width="1.5" />
  <circle cx="48" cy="42" r="3.5" fill="#E5484D" />
  <circle cx="48" cy="272" r="3" fill="#0B0E13" stroke="#E5484D" stroke-width="1.5" />

  <!-- Top Bar -->
  <text x="68" y="46" fill="#E5484D" font-size="11" font-weight="700" class="mono">01 / IDENTITY</text>
  <text x="190" y="46" fill="#3B4252" font-size="11" class="mono">·</text>
  <text x="208" y="46" fill="#8C94A4" font-size="11" font-weight="500" class="mono">HO CHI MINH CITY, VIETNAM</text>

  <!-- Right Status Pill -->
  <g transform="translate(932, 26)">
    <rect width="220" height="28" rx="14" fill="#121721" stroke="#232A38" stroke-width="1" />
    <circle cx="17" cy="14" r="3.5" fill="#10B981" class="pulse-ring" />
    <circle cx="17" cy="14" r="3.5" fill="#10B981" class="pulse-dot" />
    <text x="30" y="18" fill="#E2E6EE" font-size="10" font-weight="600" class="mono">AVAILABLE FOR WORK</text>
  </g>

  <line x1="48" y1="68" x2="1152" y2="68" stroke="#1A1F29" stroke-width="1" />

  <!-- Main Heading & Editorial Tagline -->
  <text x="68" y="158" fill="#F5F2EB" font-size="68" font-weight="800" letter-spacing="-0.03em" class="sans">TRAN TAN PHAT</text>

  <text x="68" y="204" fill="#9BA3B0" font-size="22" font-weight="400" class="sans">
    I turn ideas into <tspan fill="#F5F2EB" font-size="25" class="serif-italic">real web products</tspan><tspan fill="#E5484D" font-size="25" font-weight="700">.</tspan>
    <tspan fill="#68707E" font-size="16" dx="12">End-to-end interfaces, reliable APIs &amp; relational data layers.</tspan>
  </text>

  <!-- Bottom Connected Metadata Strip -->
  <line x1="48" y1="242" x2="1152" y2="242" stroke="#1A1F29" stroke-width="1" />

  <g transform="translate(68, 262)">
    <text x="0" y="13" fill="#68707E" font-size="10" font-weight="600" class="mono">ROLE</text>
    <text x="0" y="34" fill="#F5F2EB" font-size="14" font-weight="600" class="sans">Full-Stack Developer</text>

    <line x1="230" y1="-4" x2="230" y2="42" stroke="#1A1F29" stroke-width="1" />
    <text x="254" y="13" fill="#68707E" font-size="10" font-weight="600" class="mono">CORE STACK</text>
    <text x="254" y="34" fill="#F5F2EB" font-size="14" font-weight="600" class="sans">React 19 · Next.js 16 · NestJS · Python</text>

    <line x1="590" y1="-4" x2="590" y2="42" stroke="#1A1F29" stroke-width="1" />
    <text x="614" y="13" fill="#68707E" font-size="10" font-weight="600" class="mono">CURRENT FOCUS</text>
    <text x="614" y="34" fill="#F5F2EB" font-size="14" font-weight="600" class="sans">Building Kaikai (Platform &amp; CMS)</text>

    <line x1="896" y1="-4" x2="896" y2="42" stroke="#1A1F29" stroke-width="1" />
    <text x="920" y="13" fill="#68707E" font-size="10" font-weight="600" class="mono">PORTFOLIO</text>
    <text x="920" y="34" fill="#E5484D" font-size="14" font-weight="700" class="sans">ttanphat.vercel.app ↗</text>
  </g>
</svg>
