<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="100%">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1322" />
      <stop offset="50%" stop-color="#141D33" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="laserSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .pulse { animation: pulseAnim 2.2s infinite ease-in-out; }
      .sweep { animation: sweepAnim 6s infinite ease-in-out; will-change: transform, opacity; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes sweepAnim {
        0%, 100% { transform: translateX(-260px); opacity: 0.3; }
        50% { transform: translateX(720px); opacity: 0.95; }
      }
    </style>
  </defs>

  <!-- Full-Width 1200px Obsidian Monolith Frame -->
  <rect width="1200" height="48" rx="13" fill="url(#canvasBg)" />
  <rect x="0.75" y="0.75" width="1198.5" height="46.5" rx="12.25" fill="none" stroke="#263046" stroke-width="1.5" />

  <!-- Continuous Spine Node 06 at x=36 -->
  <line x1="32" y1="0" x2="32" y2="48" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="4 4" />
  <line x1="36" y1="0" x2="36" y2="48" stroke="#2E3C59" stroke-width="1.6" />
  <circle cx="36" cy="24" r="6.2" fill="#0B0F17" stroke="#E5484D" stroke-opacity="0.65" stroke-width="1.2" />
  <circle cx="36" cy="24" r="2.6" fill="#E5484D" />
  <line x1="42.2" y1="24" x2="61" y2="24" stroke="#E5484D" stroke-width="1.5" />
  <circle cx="61" cy="24" r="2" fill="#FF6B72" />

  <!-- HUD Launchpad Header Bar (x=64..1160, y=7..41) -->
  <rect x="64" y="7" width="1096" height="34" rx="8.5" fill="url(#barBg)" stroke="#26344E" stroke-width="1.15" />
  <rect x="80" y="7" width="240" height="1.5" fill="url(#laserSweep)" class="sweep" />

  <!-- HUD Corner Ticks -->
  <path d="M 64 15 V 7 H 72" fill="none" stroke="#E5484D" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 1152 7 H 1160 V 15" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left Title & Interactive Prompt -->
  <circle cx="84" cy="24" r="2.8" fill="#E5484D" class="pulse" />
  <text x="96" y="27.5" fill="#FF6B72" font-size="10.5" font-weight="800" class="mono">06 // INTERACTIVE COMMAND DOCK</text>
  <text x="336" y="27.5" fill="#475569" font-size="10.5" class="mono">—</text>
  <text x="354" y="27.5" fill="#CBD5E1" font-size="9.8" font-weight="600" class="mono">CLICK ANY KEYCAP BELOW TO LAUNCH LIVE DEPLOYMENT</text>

  <!-- Right Live Telemetry Pill -->
  <rect x="942" y="13" width="204" height="22" rx="5.5" fill="#090D16" stroke="#22304A" stroke-width="1" />
  <circle cx="956" cy="24" r="2.6" fill="#10B981" class="pulse" />
  <text x="966" y="27" fill="#94A3B8" font-size="8.6" font-weight="700" class="mono">5 ENDPOINTS · <tspan fill="#34D399">TLS 1.3 LIVE</tspan></text>
</svg>
