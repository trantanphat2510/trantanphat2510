<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 54" width="164" height="41">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1914" />
      <stop offset="55%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse {
        animation: pulseAnim 2.4s infinite ease-in-out;
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Beveled Glass Card Surface -->
  <rect width="216" height="54" rx="10" fill="url(#bg)" />
  <rect width="216" height="54" rx="10" fill="url(#glow)" />
  <polygon points="1,1 110,1 72,53 1,53" fill="url(#sheen)" />
  <rect x="0.75" y="0.75" width="214.5" height="52.5" rx="9.25" fill="none" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.25" />
  <rect x="2" y="2" width="212" height="50" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" />
  <line x1="16" y1="1.2" x2="200" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.9" />

  <!-- Inset Left Neon Indicator Bar (No Corner Clipping!) -->
  <rect x="4.5" y="11" width="2.8" height="32" rx="1.4" fill="#F59E0B" />

  <!-- Top Row: Live Status Dot, Category Header & Launch Button -->
  <circle cx="16" cy="16.5" r="2.6" fill="#F59E0B" class="pulse" />
  <text x="23.5" y="19.5" fill="#FBBF24" font-size="8.2" font-weight="800" class="mono">02 // FLAGSHIP SAAS</text>

  <rect x="188" y="8" width="19" height="17" rx="5" fill="#291F12" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="0.95" />
  <text x="197.5" y="19.5" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700" class="sans">↗</text>

  <!-- Bottom Row: Custom Vector Icon & Destination Title -->
  <polygon points="14.5,41 15.8,34.5 18.2,37 20,33 21.8,37 24.2,34.5 25.5,41" fill="none" stroke="#FBBF24" stroke-width="1.35" stroke-linejoin="round" />
  <line x1="14.5" y1="42.5" x2="25.5" y2="42.5" stroke="#FBBF24" stroke-width="1.35" stroke-linecap="round" />
  <text x="31" y="41" fill="#FFFFFF" font-size="13" font-weight="800" letter-spacing="-0.015em" class="sans">KAIKAI Platform</text>
</svg>
