<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 68" width="172" height="50">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B11" />
      <stop offset="55%" stop-color="#101625" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="18%" r="68%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0" />
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse { animation: pulseAnim 2.4s infinite ease-in-out; }
      .keycap-press { animation: keycapWavePress 4.2s infinite cubic-bezier(0.22, 1, 0.36, 1) 0.55s; will-change: transform; }
      .rgb-underglow { animation: rgbWaveGlow 4.2s infinite ease-in-out 0.55s; will-change: opacity; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      /* Synchronized 5-Button RGB Wave + Mechanical Keycap Tactile Press */
      @keyframes keycapWavePress {
        0%, 28%, 100% { transform: translateY(0px); }
        12%           { transform: translateY(1.8px); }
      }
      @keyframes rgbWaveGlow {
        0%, 30%, 100% { opacity: 0.35; }
        12%           { opacity: 1; }
      }
    </style>
  </defs>

  <!-- 1. 3D Mechanical Switch Bottom Housing Well & RGB Underglow Rail (y=8..67) -->
  <rect x="1" y="8" width="230" height="59" rx="11" fill="#05080F" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1" />
  <rect x="18" y="64.5" width="196" height="2.5" rx="1.2" fill="url(#waveGrad)" class="rgb-underglow" />

  <!-- 2. Tactile 3D Top Keycap Cartridge (Depresses in Synchronized RGB Wave!) -->
  <g class="keycap-press">
    <rect x="1" y="1" width="230" height="62" rx="10.5" fill="url(#bg)" />
    <rect x="1" y="1" width="230" height="62" rx="10.5" fill="url(#glow)" />
    <polygon points="2,2 126,2 82,62 2,62" fill="url(#sheen)" />
    <rect x="1" y="1" width="230" height="62" rx="10.5" fill="none" stroke="#F59E0B" stroke-opacity="0.82" stroke-width="1.25" />
    <rect x="2.5" y="2.5" width="227" height="59" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="0.8" />
    <line x1="16" y1="1.8" x2="216" y2="1.8" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="0.9" />

    <!-- HUD Corner Brackets & Left Neon Accent Bar -->
    <path d="M 1.2 9 V 2.2 A 1 1 0 0 1 2.2 1.2 H 9" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" />
    <path d="M 223 62.8 H 229.8 A 1 1 0 0 0 230.8 61.8 V 55" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" />
    <rect x="5" y="11" width="2.8" height="42" rx="1.4" fill="#F59E0B" />

    <!-- Top Header Row: Pulsing LED + Module ID + 3D Shortcut Keycap Badge [⌘1..⌘5] -->
    <circle cx="16" cy="15" r="2.5" fill="#F59E0B" class="pulse" />
    <text x="23" y="18" fill="#FBBF24" font-size="8.0" font-weight="800" class="mono">02 // SAAS CORE</text>

    <!-- 3D Mechanical Keycap Shortcut Badge -->
    <rect x="184" y="6.5" width="39" height="16.5" rx="4.5" fill="#2B2012" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="0.95" />
    <text x="203.5" y="17.5" text-anchor="middle" fill="#FFFFFF" font-size="8.2" font-weight="800" class="mono">⌘2 ↗</text>

    <!-- Custom Vector Emblem Pod (Left) -->
    <rect x="13" y="29.5" width="22" height="22" rx="6" fill="#2B2012" stroke="#F59E0B" stroke-opacity="0.55" stroke-width="0.9" />
    <polygon points="17.5,44 19,36.5 21.8,39.5 24,34.8 26.2,39.5 29,36.5 30.5,44" fill="none" stroke="#FBBF24" stroke-width="1.4" stroke-linejoin="round" />
      <line x1="17.5" y1="46" x2="30.5" y2="46" stroke="#FBBF24" stroke-width="1.4" stroke-linecap="round" />

    <!-- Destination Title & Micro-Telemetry Sub-Row (Right) -->
    <text x="42" y="39.5" fill="#FFFFFF" font-size="13.5" font-weight="800" letter-spacing="-0.015em" class="sans">KAIKAI Platform</text>
    <text x="42" y="52" fill="#94A3B8" font-size="7.4" font-weight="700" class="mono">PG-16 RLS · 10+ MODULES</text>
  </g>
</svg>
