<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 54" width="164" height="41">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121D2B" />
      <stop offset="55%" stop-color="#111726" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse {
        animation: pulseAnim 2.4s infinite ease-in-out;
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Beveled Glass Card Surface -->
  <rect width="216" height="54" rx="10" fill="url(#bg)" />
  <rect width="216" height="54" rx="10" fill="url(#glow)" />
  <polygon points="1,1 110,1 72,53 1,53" fill="url(#sheen)" />
  <rect x="0.75" y="0.75" width="214.5" height="52.5" rx="9.25" fill="none" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.25" />
  <rect x="2" y="2" width="212" height="50" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" />
  <line x1="16" y1="1.2" x2="200" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="0.9" />

  <!-- Inset Left Neon Indicator Bar (No Corner Clipping!) -->
  <rect x="4.5" y="11" width="2.8" height="32" rx="1.4" fill="#38BDF8" />

  <!-- Top Row: Live Status Dot, Category Header & Launch Button -->
  <circle cx="16" cy="16.5" r="2.6" fill="#38BDF8" class="pulse" />
  <text x="23.5" y="19.5" fill="#7DD3FC" font-size="8.2" font-weight="800" class="mono">03 // VOICE AI P2P</text>

  <rect x="188" y="8" width="19" height="17" rx="5" fill="#122438" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="0.95" />
  <text x="197.5" y="19.5" text-anchor="middle" fill="#F8FAFC" font-size="10" font-weight="700" class="sans">↗</text>

  <!-- Bottom Row: Custom Vector Icon & Destination Title -->
  <line x1="15" y1="35" x2="15" y2="39" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="18.3" y1="32" x2="18.3" y2="42" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" />
  <line x1="21.6" y1="34" x2="21.6" y2="40" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" />
  <line x1="25" y1="36" x2="25" y2="38" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" />
  <text x="31" y="41" fill="#FFFFFF" font-size="13" font-weight="800" letter-spacing="-0.015em" class="sans">MurMur Voice AI</text>
</svg>
