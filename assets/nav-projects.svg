<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 228 60" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B132D" />
      <stop offset="55%" stop-color="#0F1523" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.05em;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse { animation: pulseAnim 2.4s infinite ease-in-out; }
      .keycap-press { animation: keycapWavePress 4.2s infinite cubic-bezier(0.22, 1, 0.36, 1) 1.65s; will-change: transform; }
      .rgb-underglow { animation: rgbWaveGlow 4.2s infinite ease-in-out 1.65s; will-change: opacity; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes keycapWavePress {
        0%, 28%, 100% { transform: translateY(0px); }
        12%           { transform: translateY(1.6px); }
      }
      @keyframes rgbWaveGlow {
        0%, 30%, 100% { opacity: 0.32; }
        12%           { opacity: 1; }
      }
    </style>
  </defs>

  <!-- 1. 3D Mechanical Switch Bottom Well & RGB Underglow Rail -->
  <rect x="1" y="7" width="226" height="52" rx="10" fill="#05080F" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
  <rect x="20" y="56.5" width="188" height="2.2" rx="1.1" fill="url(#waveGrad)" class="rgb-underglow" />

  <!-- 2. Minimalist Raycast/Linear 3D Keycap Top Surface -->
  <g class="keycap-press">
    <rect x="1" y="1" width="226" height="54" rx="9.5" fill="url(#bg)" />
    <rect x="1" y="1" width="226" height="54" rx="9.5" fill="url(#glow)" />
    <rect x="1" y="1" width="226" height="54" rx="9.5" fill="none" stroke="#A855F7" stroke-opacity="0.75" stroke-width="1.2" />
    <line x1="14" y1="1.8" x2="214" y2="1.8" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.85" />
    <rect x="5" y="11" width="2.6" height="34" rx="1.3" fill="#A855F7" />

    <!-- Left 32x32 Vector Emblem Pod -->
    <rect x="13" y="12" width="32" height="32" rx="7.5" fill="#211538" stroke="#A855F7" stroke-opacity="0.55" stroke-width="0.95" />
    <rect x="21.5" y="20.5" width="6.2" height="6.2" rx="1.4" fill="none" stroke="#C084FC" stroke-width="1.4" />
      <rect x="30.3" y="20.5" width="6.2" height="6.2" rx="1.4" fill="none" stroke="#C084FC" stroke-width="1.4" />
      <rect x="21.5" y="29.3" width="6.2" height="6.2" rx="1.4" fill="none" stroke="#C084FC" stroke-width="1.4" />
      <rect x="30.3" y="29.3" width="6.2" height="6.2" rx="1.4" fill="none" stroke="#38BDF8" stroke-width="1.4" />

    <!-- Center-Right Title & Clean Subtitle -->
    <text x="53" y="26.5" fill="#FFFFFF" font-size="13.5" font-weight="800" letter-spacing="-0.015em" class="sans">Case Studies</text>
    <text x="53" y="40.5" fill="#94A3B8" font-size="7.4" font-weight="700" class="mono">4 PRODUCTION SYSTEMS</text>

    <!-- Top-Right Pulsing Status Dot + 3D Shortcut Keycap Badge [⌘1..⌘5] -->
    <circle cx="176" cy="15.8" r="2.2" fill="#A855F7" class="pulse" />
    <rect x="183" y="8" width="36" height="15.5" rx="4" fill="#211538" stroke="#A855F7" stroke-opacity="0.75" stroke-width="0.9" />
    <text x="201" y="18.2" text-anchor="middle" fill="#F8FAFC" font-size="7.8" font-weight="800" class="mono">⌘4 ↗</text>
  </g>
</svg>
