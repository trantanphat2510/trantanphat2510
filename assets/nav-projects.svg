<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 68" width="172" height="50">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A142B" />
      <stop offset="55%" stop-color="#101625" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <radialGradient id="glow" cx="88%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.24" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.065" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pulse { animation: pulseAnim 2.4s infinite ease-in-out; }
      .scan { animation: scanAnim 4.5s infinite ease-in-out; }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes scanAnim {
        0%, 100% { transform: translateY(0px); opacity: 0.15; }
        50% { transform: translateY(42px); opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- 1. Beveled Glass Card Surface & Specular Rim -->
  <rect width="232" height="68" rx="11" fill="url(#bg)" />
  <rect width="232" height="68" rx="11" fill="url(#glow)" />
  <polygon points="1,1 124,1 80,67 1,67" fill="url(#sheen)" />
  <rect x="0.75" y="0.75" width="230.5" height="66.5" rx="10.25" fill="none" stroke="#A855F7" stroke-opacity="0.72" stroke-width="1.25" />
  <rect x="2" y="2" width="228" height="64" rx="9" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.8" />
  <line x1="16" y1="1.2" x2="216" y2="1.2" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.9" />

  <!-- 2. HUD Corner Brackets & Left Neon Bar -->
  <path d="M 0.8 8 V 1.5 A 1 1 0 0 1 1.8 0.8 H 8" fill="none" stroke="#C084FC" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 224 67.2 H 230.2 A 1 1 0 0 0 231.2 66.2 V 60" fill="none" stroke="#C084FC" stroke-width="1.4" stroke-linecap="round" />
  <rect x="4.5" y="12" width="2.8" height="44" rx="1.4" fill="#A855F7" />
  <rect x="12" y="16" width="208" height="1.2" fill="url(#scanGrad)" class="scan" />

  <!-- 3. Top Header Row: Pulsing LED + Module ID + Launch Keycap -->
  <circle cx="16" cy="15.5" r="2.6" fill="#A855F7" class="pulse" />
  <text x="23.5" y="18.5" fill="#C084FC" font-size="8.2" font-weight="800" class="mono">04 // ARCHIVE</text>

  <rect x="202" y="7" width="21" height="17" rx="5" fill="#23163B" stroke="#A855F7" stroke-opacity="0.6" stroke-width="0.95" />
  <text x="212.5" y="18.5" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="800" class="sans">↗</text>

  <!-- 4. Custom Vector Emblem Pod (Left) -->
  <rect x="13" y="31" width="22" height="22" rx="6" fill="#23163B" stroke="#A855F7" stroke-opacity="0.5" stroke-width="0.9" />
  <rect x="17.5" y="35.5" width="5.5" height="5.5" rx="1.2" fill="none" stroke="#C084FC" stroke-width="1.35" />
    <rect x="25" y="35.5" width="5.5" height="5.5" rx="1.2" fill="none" stroke="#C084FC" stroke-width="1.35" />
    <rect x="17.5" y="43" width="5.5" height="5.5" rx="1.2" fill="none" stroke="#C084FC" stroke-width="1.35" />
    <rect x="25" y="43" width="5.5" height="5.5" rx="1.2" fill="none" stroke="#38BDF8" stroke-width="1.35" />

  <!-- 5. Destination Title & Micro-Telemetry Sub-Row (Right) -->
  <text x="42" y="41" fill="#FFFFFF" font-size="13.5" font-weight="800" letter-spacing="-0.015em" class="sans">4 Case Studies</text>
  <text x="42" y="53.5" fill="#94A3B8" font-size="7.5" font-weight="700" class="mono">E2E PLAYWRIGHT · CI/CD</text>
</svg>
