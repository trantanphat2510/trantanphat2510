<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E13" />
      <stop offset="100%" stop-color="#10141D" />
    </linearGradient>
    <linearGradient id="cellBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121722" />
      <stop offset="100%" stop-color="#0D1017" />
    </linearGradient>
    <radialGradient id="crimsonBottom" cx="50%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .serif-italic {
        font-family: 'Fraunces', 'Playfair Display', Georgia, serif;
        font-style: italic;
        font-weight: 400;
      }
    </style>
  </defs>

  <rect width="1200" height="350" rx="14" fill="url(#bg)" />
  <rect width="1200" height="350" rx="14" fill="url(#crimsonBottom)" />
  <rect x="0.75" y="0.75" width="1198.5" height="348.5" rx="13.25" fill="none" stroke="#1E232E" stroke-width="1.5" />

  <!-- Continuous Left Architectural Spine -->
  <line x1="48" y1="0" x2="48" y2="306" stroke="#1E232E" stroke-width="1" />
  <line x1="48" y1="0" x2="48" y2="42" stroke="#E5484D" stroke-width="1.5" />
  <circle cx="48" cy="36" r="3.5" fill="#E5484D" />
  <circle cx="48" cy="252" r="3.5" fill="#E5484D" />

  <!-- Section 04 Header -->
  <text x="68" y="40" fill="#E5484D" font-size="11" font-weight="700" class="mono">04 / CAPABILITIES &amp; TECH STACK</text>
  <text x="348" y="40" fill="#3B4252" font-size="11" class="mono">·</text>
  <text x="366" y="40" fill="#8C94A4" font-size="11" font-weight="500" class="mono">TOOLS GROUPED BY ARCHITECTURAL OWNERSHIP</text>

  <!-- 4-COLUMN TECH STACK MATRIX -->
  <!-- Col 1: Frontend & State -->
  <g transform="translate(68, 58)">
    <rect width="258" height="156" rx="10" fill="url(#cellBg)" stroke="#1E2432" />
    <text x="18" y="28" fill="#E5484D" font-size="10" font-weight="700" class="mono">04.1 / CLIENT &amp; STATE</text>
    <text x="18" y="56" fill="#F5F2EB" font-size="14" font-weight="700" class="sans">React 19 · Next.js 16</text>
    <text x="18" y="80" fill="#C7CCD6" font-size="13" class="sans">TypeScript · JavaScript</text>
    <text x="18" y="104" fill="#C7CCD6" font-size="13" class="sans">React Query · Zustand · Redux</text>
    <text x="18" y="128" fill="#8C94A4" font-size="12" class="sans">Tailwind CSS · Motion · Lenis</text>
  </g>

  <!-- Col 2: Backend & AI -->
  <g transform="translate(342, 58)">
    <rect width="258" height="156" rx="10" fill="url(#cellBg)" stroke="#1E2432" />
    <text x="18" y="28" fill="#E5484D" font-size="10" font-weight="700" class="mono">04.2 / API &amp; AI SERVICES</text>
    <text x="18" y="56" fill="#F5F2EB" font-size="14" font-weight="700" class="sans">NestJS 11 · Node.js · Express</text>
    <text x="18" y="80" fill="#F5F2EB" font-size="14" font-weight="700" class="sans">Python · FastAPI</text>
    <text x="18" y="104" fill="#C7CCD6" font-size="13" class="sans">WebRTC · ElevenLabs · PHP</text>
    <text x="18" y="128" fill="#8C94A4" font-size="12" class="sans">REST APIs · Zod Validation</text>
  </g>

  <!-- Col 3: Data & Security -->
  <g transform="translate(616, 58)">
    <rect width="258" height="156" rx="10" fill="url(#cellBg)" stroke="#1E2432" />
    <text x="18" y="28" fill="#E5484D" font-size="10" font-weight="700" class="mono">04.3 / DATA &amp; SECURITY</text>
    <text x="18" y="56" fill="#F5F2EB" font-size="14" font-weight="700" class="sans">PostgreSQL · Supabase</text>
    <text x="18" y="80" fill="#C7CCD6" font-size="13" class="sans">Prisma ORM · Drizzle ORM</text>
    <text x="18" y="104" fill="#C7CCD6" font-size="13" class="sans">SQLite · MongoDB</text>
    <text x="18" y="128" fill="#8C94A4" font-size="12" class="sans">JWT · RBAC Guards · PG RLS</text>
  </g>

  <!-- Col 4: Infra & Delivery -->
  <g transform="translate(890, 58)">
    <rect width="262" height="156" rx="10" fill="url(#cellBg)" stroke="#1E2432" />
    <text x="18" y="28" fill="#E5484D" font-size="10" font-weight="700" class="mono">04.4 / DELIVERY &amp; OPS</text>
    <text x="18" y="56" fill="#F5F2EB" font-size="14" font-weight="700" class="sans">Docker · Vercel</text>
    <text x="18" y="80" fill="#C7CCD6" font-size="13" class="sans">Git · GitHub Workflows</text>
    <text x="18" y="104" fill="#C7CCD6" font-size="13" class="sans">Playwright · Lighthouse Lab</text>
    <text x="18" y="128" fill="#8C94A4" font-size="12" class="sans">Figma-to-Code · pnpm</text>
  </g>

  <!-- Divider before Section 05 -->
  <line x1="48" y1="232" x2="1152" y2="232" stroke="#1E232E" stroke-width="1" />

  <!-- Section 05: Philosophy -->
  <text x="68" y="256" fill="#E5484D" font-size="11" font-weight="700" class="mono">05 / BUILT WITH INTENTION</text>

  <text x="68" y="294" fill="#F5F2EB" font-size="24" font-weight="700" letter-spacing="-0.02em" class="sans">
    “Good engineering is not just about writing code. It’s about building something that <tspan fill="#E5484D" font-size="27" class="serif-italic">matters.</tspan>”
  </text>

  <text x="68" y="324" fill="#8C94A4" font-size="11" font-weight="600" class="mono">
    TRAN TAN PHAT   ·   TTANPHAT.WORK@GMAIL.COM   ·   TTANPHAT.VERCEL.APP
  </text>
</svg>
