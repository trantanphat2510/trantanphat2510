<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="590" height="250" rx="16" fill="url(#bg)" />
  <rect width="590" height="250" rx="16" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="588.5" height="248.5" rx="15.25" fill="none" stroke="#262C3A" stroke-width="1.5" />

  <!-- Top Row -->
  <text x="28" y="38" fill="#E5484D" font-size="11" font-weight="700" class="mono">01 / WEB PLATFORM &amp; CMS</text>
  <g transform="translate(424, 21)">
    <rect width="138" height="24" rx="12" fill="#1C1418" stroke="#4D2228" />
    <circle cx="14" cy="12" r="3.5" fill="#E5484D" />
    <text x="25" y="15.5" fill="#F2B8B5" font-size="9.5" font-weight="600" class="mono">website-kaikai ↗</text>
  </g>

  <!-- Title & Summary -->
  <text x="28" y="78" fill="#F5F2EB" font-size="28" font-weight="800" class="sans">Kaikai</text>
  <text x="28" y="106" fill="#9BA3B0" font-size="13.5" class="sans">
    Customer ordering platform &amp; operator CMS over one relational layer.
  </text>
  <text x="28" y="126" fill="#9BA3B0" font-size="13.5" class="sans">
    Single-flight read coalescing, route caching &amp; 3-layer authorization.
  </text>

  <!-- Mini Architecture Flow -->
  <g transform="translate(28, 146)">
    <rect width="534" height="40" rx="8" fill="#10141D" stroke="#1F2532" />
    <text x="16" y="24" fill="#68707E" font-size="10" font-weight="700" class="mono">ARCH:</text>
    <text x="64" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">NEXT.JS 16 CACHE</text>
    <text x="196" y="24" fill="#E5484D" font-size="11" class="mono">→</text>
    <text x="216" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">NESTJS 11 RBAC</text>
    <text x="338" y="24" fill="#E5484D" font-size="11" class="mono">→</text>
    <text x="358" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">POSTGRESQL RLS</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 202)">
    <rect width="84" height="24" rx="6" fill="#171C28" />
    <text x="42" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Next.js 16</text>

    <rect x="92" width="76" height="24" rx="6" fill="#171C28" />
    <text x="130" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">React 19</text>

    <rect x="176" width="82" height="24" rx="6" fill="#171C28" />
    <text x="217" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">NestJS 11</text>

    <rect x="266" width="90" height="24" rx="6" fill="#171C28" />
    <text x="311" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">PostgreSQL</text>

    <rect x="364" width="78" height="24" rx="6" fill="#171C28" />
    <text x="403" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Supabase</text>

    <rect x="450" width="84" height="24" rx="6" fill="#171C28" />
    <text x="492" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Prisma ORM</text>
  </g>
</svg>
