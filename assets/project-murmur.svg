      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .bar1 { animation: wave 1.2s infinite ease-in-out; }
      .bar2 { animation: wave 1.2s infinite ease-in-out 0.2s; }
      .bar3 { animation: wave 1.2s infinite ease-in-out 0.4s; }
      @keyframes wave {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
