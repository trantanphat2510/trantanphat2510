<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .bar1 { animation: wave 1.2s infinite ease-in-out; }
      .bar2 { animation: wave 1.2s infinite ease-in-out 0.2s; }
      .bar3 { animation: wave 1.2s infinite ease-in-out 0.4s; }
      @keyframes wave {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="590" height="250" rx="16" fill="url(#bg)" />
  <rect width="590" height="250" rx="16" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="588.5" height="248.5" rx="15.25" fill="none" stroke="#262C3A" stroke-width="1.5" />

  <!-- Top Row -->
  <text x="28" y="38" fill="#10B981" font-size="11" font-weight="700" class="mono">02 / VOICE AI CONVERSATION APP</text>
  <g transform="translate(424, 21)">
    <rect width="138" height="24" rx="12" fill="#111F1B" stroke="#1E4638" />
    <rect x="13" y="9" width="2" height="6" rx="1" fill="#10B981" class="bar1" />
    <rect x="17" y="6" width="2" height="12" rx="1" fill="#10B981" class="bar2" />
    <rect x="21" y="8" width="2" height="8" rx="1" fill="#10B981" class="bar3" />
    <text x="30" y="15.5" fill="#A7F3D0" font-size="9.5" font-weight="600" class="mono">murmur-voice ↗</text>
  </g>

  <!-- Title & Summary -->
  <text x="28" y="78" fill="#F5F2EB" font-size="28" font-weight="800" class="sans">Murmur</text>
  <text x="28" y="106" fill="#9BA3B0" font-size="13.5" class="sans">
    Real-time bidirectional voice AI over WebRTC with ElevenLabs agent.
  </text>
  <text x="28" y="126" fill="#9BA3B0" font-size="13.5" class="sans">
    Server-side HMAC token isolation &amp; idempotent SQLite transcript writes.
  </text>

  <!-- Mini Architecture Flow -->
  <g transform="translate(28, 146)">
    <rect width="534" height="40" rx="8" fill="#10141D" stroke="#1F2532" />
    <text x="16" y="24" fill="#68707E" font-size="10" font-weight="700" class="mono">ARCH:</text>
    <text x="64" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">WEBRTC STREAM</text>
    <text x="184" y="24" fill="#10B981" font-size="11" class="mono">⇄</text>
    <text x="206" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">HMAC TOKEN API</text>
    <text x="334" y="24" fill="#10B981" font-size="11" class="mono">→</text>
    <text x="354" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">SQLITE + DRIZZLE</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 202)">
    <rect width="74" height="24" rx="6" fill="#171C28" />
    <text x="37" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Next.js</text>

    <rect x="82" width="88" height="24" rx="6" fill="#171C28" />
    <text x="126" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">ElevenLabs</text>

    <rect x="178" width="74" height="24" rx="6" fill="#171C28" />
    <text x="215" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">WebRTC</text>

    <rect x="260" width="90" height="24" rx="6" fill="#171C28" />
    <text x="305" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Drizzle ORM</text>

    <rect x="358" width="70" height="24" rx="6" fill="#171C28" />
    <text x="393" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">SQLite</text>

    <rect x="436" width="98" height="24" rx="6" fill="#171C28" />
    <text x="485" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Docker · Zod</text>
  </g>
</svg>
