<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#0B0E13" />
    </linearGradient>
    <radialGradient id="glow" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0B0E13" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono {
        font-family: 'Geist Mono', 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <rect width="590" height="250" rx="16" fill="url(#bg)" />
  <rect width="590" height="250" rx="16" fill="url(#glow)" />
  <rect x="0.75" y="0.75" width="588.5" height="248.5" rx="15.25" fill="none" stroke="#262C3A" stroke-width="1.5" />

  <!-- Top Row -->
  <text x="28" y="38" fill="#38BDF8" font-size="11" font-weight="700" class="mono">03 / FULL-STACK SOCIAL PLATFORM</text>
  <g transform="translate(442, 21)">
    <rect width="120" height="24" rx="12" fill="#111A24" stroke="#1E3A54" />
    <text x="60" y="15.5" text-anchor="middle" fill="#BAE6FD" font-size="9.5" font-weight="600" class="mono">CASE STUDY ↗</text>
  </g>

  <!-- Title & Summary -->
  <text x="28" y="78" fill="#F5F2EB" font-size="28" font-weight="800" class="sans">Social App Management</text>
  <text x="28" y="106" fill="#9BA3B0" font-size="13.5" class="sans">
    State-heavy social network engineered around strict state ownership.
  </text>
  <text x="28" y="126" fill="#9BA3B0" font-size="13.5" class="sans">
    Separates server cache from local UI drafts with containerized delivery.
  </text>

  <!-- Mini Architecture Flow -->
  <g transform="translate(28, 146)">
    <rect width="534" height="40" rx="8" fill="#10141D" stroke="#1F2532" />
    <text x="16" y="24" fill="#68707E" font-size="10" font-weight="700" class="mono">STATE:</text>
    <text x="72" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">REACT QUERY (SERVER)</text>
    <text x="242" y="24" fill="#38BDF8" font-size="11" class="mono">‖</text>
    <text x="262" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">ZUSTAND (SESSION UI)</text>
    <text x="424" y="24" fill="#38BDF8" font-size="11" class="mono">→</text>
    <text x="444" y="24" fill="#E2E6EE" font-size="11" font-weight="600" class="mono">DOCKER</text>
  </g>

  <!-- Tech Stack Pills -->
  <g transform="translate(28, 202)">
    <rect width="74" height="24" rx="6" fill="#171C28" />
    <text x="37" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Next.js</text>

    <rect x="82" width="90" height="24" rx="6" fill="#171C28" />
    <text x="127" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">TypeScript</text>

    <rect x="180" width="98" height="24" rx="6" fill="#171C28" />
    <text x="229" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">React Query</text>

    <rect x="286" width="76" height="24" rx="6" fill="#171C28" />
    <text x="324" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Zustand</text>

    <rect x="370" width="84" height="24" rx="6" fill="#171C28" />
    <text x="412" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Tailwind</text>

    <rect x="462" width="72" height="24" rx="6" fill="#171C28" />
    <text x="498" y="15.5" text-anchor="middle" fill="#C7CCD6" font-size="10" font-weight="600" class="mono">Docker</text>
  </g>
</svg>
